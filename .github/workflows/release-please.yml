name: Release Please

# Every green push to main that has a feat: or fix: commit ships a release, so
# anyone with auto-update on gets the new version without anyone merging a PR.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open or update the release PR
        id: pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Merge the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only Release Please's own PR: its branch, opened by the Actions bot, from this repo.
          # Filtered here, not with --label/--author: those go through the search index,
          # which misses the PR Release Please opened a second ago.
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head release-please--branches--main--components--wtf-meter \
            --json number,headRepositoryOwner,author,labels \
            -q "[.[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\" and .author.login == \"app/github-actions\" and any(.labels[]; .name == \"autorelease: pending\")) | .number] | @sh")
          set -- $PRS
          if [ $# -eq 0 ]; then echo "No release PR to merge."; exit 0; fi
          if [ $# -gt 1 ]; then echo "More than one release PR ($PRS); not merging."; exit 1; fi
          gh pr merge "$1" --squash --repo "$GITHUB_REPOSITORY"

      # A merge made with GITHUB_TOKEN starts no new workflow run, so tag the release here.
      # With nothing merged this is a no-op.
      - name: Tag and publish the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
