# Secrets (gitleaks defaults) plus personal data that should never ship in a public repo.
# Slack IDs are left alone: they're opaque without workspace access.
title = "wtf-meter"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "A real email address"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'''
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''@users\.noreply\.github\.com''', '''noreply@anthropic\.com''', '''@[a-z.-]*example(?:\.[a-z]+)?\b''', '''@[a-z.-]*\.test\b''']

[[rules]]
id = "home-path"
description = "A local home directory path (leaks a username)"
regex = '''/(?:Users|home)/[A-Za-z][A-Za-z0-9._-]+/'''
